name: Automated Ingestion & Enrichment Pipeline

on:
  schedule:
    # Chạy hằng ngày lúc 02:00 sáng (Giờ Việt Nam UTC+7, tức 19:00 UTC)
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: "Ramp-up Stage (1: 10 places, 2: 20 places, 3: 50 places)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Master Pipeline Runner
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RAMP_UP_STAGE: ${{ github.event.inputs.stage || '1' }}
        run: |
          pnpm cron:pipeline
