name: Automated Ingestion & Enrichment Pipeline

on:
  schedule:
    # Chạy hằng ngày lúc 03:30 sáng (Giờ Việt Nam UTC+7, tức 20:30 UTC)
    # Khung giờ vàng: Overpass server vắng nhất, Quota YouTube tươi mới, Web không có người dùng
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Chạy thủ công ngay lập tức"
        required: false
        default: "true"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Master Daily Pipeline (100% Free)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: |
          pnpm pipeline:daily
